quarkus.application.name=zip-buildserver-api
quarkus.http.root-path=/
quarkus.http.test-port=0

# Database defaults for Docker Compose/local development.
# Tests keep Dev Services disabled until database-backed tests are introduced.
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/zip_buildserver}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:zip_buildserver}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:zip_buildserver}
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.path=/q/openapi

# Test profile uses Quarkus Dev Services/Testcontainers for database-backed tests.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none

# Package intake limits and storage
zip-buildserver.storage.packages-dir=${ZIP_BUILDSERVER_PACKAGES_DIR:target/zip-buildserver/packages}
zip-buildserver.packages.max-compressed-size-bytes=${ZIP_BUILDSERVER_MAX_ARCHIVE_SIZE_BYTES:104857600}
zip-buildserver.packages.max-extracted-size-bytes=${ZIP_BUILDSERVER_MAX_EXTRACTED_SIZE_BYTES:524288000}
zip-buildserver.packages.max-files=${ZIP_BUILDSERVER_MAX_FILES:20000}
zip-buildserver.packages.max-path-length=${ZIP_BUILDSERVER_MAX_PATH_LENGTH:1024}

